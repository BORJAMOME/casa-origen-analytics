name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 mlxtend==0.23.1 pyarrow==17.0.0 joblib==1.4.2 pytest==8.3.2
      - run: pytest
